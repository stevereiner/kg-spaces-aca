# For a production ACA build served by your own nginx: the counterpart of the dev server's
# proxy.conf.js, which only exists under `npm start`. Not needed for this repo's Docker image,
# whose docker/default.conf.template already has it.
#
# Add inside the existing server { } block that serves ACA. Point proxy_pass at your backend.

# File upload on the OTHER SOURCES tab goes through /api/upload; nginx's 1 MB default would
# reject most documents before they reach the backend.
client_max_body_size 200m;

location /api/ {
  proxy_pass http://flexible-graphrag:8000/api/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # AI query and chat wait on an LLM, and ingest with knowledge-graph extraction is slow
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
}
